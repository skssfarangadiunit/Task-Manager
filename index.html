<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKSSF ആറങ്ങാടി യൂണിറ്റ് - കർമ്മപദ്ധതി & അഡ്മിൻ പോർട്ടൽ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #047857;
      --primary-dark: #065f46;
      --primary-light: #ecfdf5;
      --accent: #0284c7;
      --danger: #dc2626;
      --warning: #d97706;
      --orange-low: #ea580c;
      --purple-missed: #7c3aed;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --wa-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans Malayalam', 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.55;
      padding-bottom: 80px;
    }

    /* AUTH GATE SCREEN */
    #auth-gate-screen {
      position: fixed; inset: 0;
      background: #0f172a;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 99999;
    }

    .auth-card {
      background: #ffffff; width: 100%; max-width: min(100%, 460px);
      border-radius: 20px; padding: 28px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .auth-badge {
      display: inline-block; background: #ecfdf5; color: #065f46;
      padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
      margin-bottom: 12px;
    }

    .auth-card h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .auth-card p.auth-desc { font-size: 13px; color: #64748b; margin-bottom: 16px; line-height: 1.5; }

    .role-hint-box {
      background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 16px; font-size: 11.5px; text-align: left;
      color: #334155; line-height: 1.5;
    }

    .pin-input-wrapper { position: relative; margin-bottom: 14px; }

    .auth-input {
      width: 100%; padding: 13px 60px 13px 18px; border-radius: 10px;
      border: 2px solid #cbd5e1; font-size: 22px; text-align: center; letter-spacing: 6px;
      font-weight: 800; outline: none; transition: all 0.2s; background: #f8fafc; color: #0f172a;
    }

    .auth-input:focus {
      background: #ffffff; border-color: #047857;
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.18);
    }

    .btn-toggle-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px;
      color: #475569; font-size: 11.5px; font-weight: 700; cursor: pointer; padding: 5px 8px;
    }

    .auth-btn {
      width: 100%; background: #047857; color: #ffffff; padding: 13px 18px;
      border-radius: 10px; border: none; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-bottom: 8px; transition: background 0.2s;
    }
    .auth-btn:hover { background: #065f46; }

    .guest-btn {
      width: 100%; background: transparent; color: #64748b; padding: 9px 16px;
      border-radius: 10px; border: 1px solid #cbd5e1; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .guest-btn:hover { background: #f1f5f9; color: #0f172a; }

    .auth-error {
      color: #dc2626; font-size: 12px; font-weight: 600; margin-top: 10px; display: none;
      background: #fef2f2; padding: 8px 12px; border-radius: 8px; border: 1px solid #fecaca;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #065f46 0%, #047857 60%, #0f766e 100%);
      color: #ffffff; padding: 12px 16px; position: sticky; top: 0; z-index: 50;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      width: 100%;
    }

    .header-container {
      max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center; gap: 10px;
      width: 100%;
    }

    .brand { min-width: 0; }
    .brand h1 { font-size: 17px; font-weight: 800; line-height: 1.25; }
    .brand p { font-size: 11px; color: #a7f3d0; }

    .header-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .role-badge {
      background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #ffffff;
      white-space: nowrap;
    }

    .btn-header {
      background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 10px; border-radius: 999px; font-size: 11.5px; color: #fff;
      cursor: pointer; font-weight: 700; transition: background 0.15s ease;
      display: inline-flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .btn-header:hover { background: rgba(15, 23, 42, 0.7); }
    .btn-header.btn-lock:hover { background: rgba(225, 29, 72, 0.6); }

    /* MAIN CONTAINER */
    main {
      max-width: 1240px; margin: 14px auto; padding: 0 12px;
      display: flex; flex-direction: column; gap: 14px;
      width: 100%;
    }

    /* METRICS STRIP */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
      gap: 10px;
      width: 100%;
    }

    .metric-card {
      background: #ffffff; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02); position: relative; overflow: hidden;
      min-width: 0;
    }

    .metric-card::before {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
    }
    .metric-card.card-total::before { background: #0284c7; }
    .metric-card.card-done::before { background: #16a34a; }
    .metric-card.card-progress::before { background: #ca8a04; }
    .metric-card.card-pending::before { background: #dc2626; }
    .metric-card.card-missed::before { background: #7c3aed; }

    .metric-icon {
      width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .card-total .metric-icon { background: #e0f2fe; color: #0284c7; }
    .card-done .metric-icon { background: #dcfce7; color: #16a34a; }
    .card-progress .metric-icon { background: #fef9c3; color: #ca8a04; }
    .card-pending .metric-icon { background: #fee2e2; color: #dc2626; }
    .card-missed .metric-icon { background: #f3e8ff; color: #7c3aed; }

    .metric-data { min-width: 0; flex: 1; }
    .metric-data h3 { font-size: 18px; font-weight: 800; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-data p { font-size: 10.5px; color: var(--text-muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress-bar-container {
      background: #e2e8f0; height: 5px; border-radius: 999px;
      overflow: hidden; margin-top: 5px; display: flex; width: 100%;
    }
    .progress-segment { height: 100%; transition: width 0.3s ease; }

    /* FILTER BAR */
    .filter-panel {
      background: #ffffff; border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 10px; width: 100%;
    }

    .filter-controls-wrap {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%;
    }
    @media (min-width: 768px) {
      .filter-controls-wrap { width: auto; }
    }

    .month-dropdown {
      padding: 7px 12px; border-radius: 8px; border: 1.5px solid #047857;
      background: #f0fdf4; font-size: 12.5px; font-weight: 700; color: #064e3b;
      outline: none; cursor: pointer; max-width: 100%;
    }

    .year-dropdown, .cal-dropdown {
      padding: 6px 10px; border-radius: 8px; border: 1.5px solid #cbd5e1;
      background: #ffffff; font-size: 12px; font-weight: 700; color: #1e293b;
      outline: none; cursor: pointer;
    }

    .today-banner {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #e0f2fe 100%);
      border: 1.5px solid #86efac; border-radius: 14px; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px; width: 100%;
      box-shadow: 0 2px 8px rgba(4, 120, 87, 0.05);
    }
    @media (min-width: 640px) {
      .today-banner { flex-direction: row; justify-content: space-between; align-items: center; }
    }

    .today-badge-chip {
      background: #047857; color: #fff; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px;
    }

    .dual-metrics-wrapper {
      display: flex; flex-direction: column; gap: 12px; width: 100%;
    }

    .metrics-section-title {
      font-size: 12.5px; font-weight: 800; color: #0f172a;
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }

    /* TABS */
    .tabs-bar {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
      border-bottom: 2px solid var(--border); scrollbar-width: thin;
      width: 100%; -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border); background: #ffffff;
      color: var(--text-muted); transition: all 0.2s ease; white-space: nowrap;
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--primary); color: #ffffff; border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(4, 120, 87, 0.25);
    }
    .tab-btn.tab-admin.active { background: #4f46e5; border-color: #4f46e5; }
    .tab-btn.tab-settings.active { background: #0f766e; border-color: #0f766e; }

    /* CONTENT CARD */
    .content-card {
      background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
      padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      width: 100%; max-width: 100%; overflow: hidden;
    }
    @media (min-width: 640px) {
      .content-card { padding: 20px; }
    }

    .card-header {
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 12px; margin-bottom: 14px;
      border-bottom: 1px solid var(--border); padding-bottom: 12px;
      width: 100%;
    }
    @media (min-width: 768px) {
      .card-header {
        flex-direction: row; justify-content: space-between; align-items: flex-start;
      }
    }

    .card-title { width: 100%; min-width: 0; }
    @media (min-width: 768px) {
      .card-title { flex: 1; }
    }
    .card-title h2 { font-size: 16px; font-weight: 800; color: var(--text-main); word-break: break-word; }
    .card-title p { font-size: 12px; color: var(--text-muted); word-break: break-word; }

    .action-group {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      width: 100%;
    }
    @media (min-width: 768px) {
      .action-group { width: auto; margin-left: auto; justify-content: flex-end; }
    }

    .select-dropdown {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      font-size: 12px; font-weight: 600; background-color: #f1f5f9;
      color: var(--text-main); outline: none; max-width: 100%;
    }

    .btn-copy {
      background: var(--primary); color: #ffffff; border: none; padding: 7px 12px;
      border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    .btn-whatsapp {
      background: var(--wa-green); color: #ffffff; border: none; padding: 7px 12px;
      border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
      display: inline-block;
    }

    .msg-box {
      background: #0b141a; color: #d1d7db; border-radius: 12px; padding: 14px;
      font-family: 'SF Pro Text', Consolas, Monaco, monospace; font-size: 12.5px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
      overflow-x: auto; max-height: 440px; user-select: all;
      border: 1px solid #202c33; margin-bottom: 16px; width: 100%;
    }

    /* INTERACTIVE TASKS */
    .view-tasks-section {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 14px; margin-top: 14px; width: 100%; overflow: hidden;
    }

    .view-tasks-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap; gap: 6px; width: 100%;
    }
    .view-tasks-header h3 { font-size: 13.5px; font-weight: 800; word-break: break-word; }

    /* TASK CARD RESPONSIVE LAYOUT */
    .task-interactive-card {
      background: #ffffff; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px; display: flex; flex-direction: column;
      gap: 10px; width: 100%; min-width: 0;
    }
    @media (min-width: 640px) {
      .task-interactive-card {
        flex-direction: row; justify-content: space-between; align-items: flex-start; gap: 12px;
      }
    }

      <div id="toast"><span id="toast-text">സന്ദേശം കോപ്പി ചെയ്തു!</span></div>

      <!-- Today's Significance Spotlight Banner -->
      <div class="today-banner">
        <div style="min-width:0; flex:1;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
            <span class="today-badge-chip">🌟 ഇന്നത്തെ തീയതി & ദിനവിശേഷം</span>
            <span id="live-today-fulldate" style="font-size:12px; font-weight:800; color:#065f46;">ഇന്ന് ലോഡ് ചെയ്യുന്നു...</span>
          </div>
          <div id="live-today-specialty" style="font-size:12px; color:#334155; line-height:1.5;">
            ഇന്നത്തെ ആത്മീയ-ഭൗതിക ദിനവിശേഷങ്ങൾ കണ്ടെത്തുന്നു...
          </div>
        </div>
        <div style="display:flex; gap:6px; flex-shrink:0; align-items:center; flex-wrap:wrap;">
          <button onclick="switchTab('today')" class="btn-primary-sm" style="font-size:11.5px; padding:6px 12px;">
            ⚡ ഇന്നത്തെ ഡ്യൂട്ടി കാണുക
          </button>
        </div>
      </div>

      <!-- Overall Metrics Strip: Dual View (Annual Cumulative & Selected Month) -->
      <div class="dual-metrics-wrapper">
        <!-- Section A: Active Month Metrics -->
        <div>
          <div class="metrics-section-title">
            <span>📅 ഈ മാസത്തെ പുരോഗതി (Selected Month: <span id="metrics-active-month-label" style="color:#047857;">റബീഉൽ ആഖിർ</span>)</span>
          </div>
          <div class="metrics-grid">
            <div class="metric-card card-total">
              <div class="metric-icon">📋</div>
              <div class="metric-data">
                <h3 id="stat-month-total">0</h3>
                <p>മാസ ടാസ്‌കുകൾ</p>
              </div>
            </div>
            <div class="metric-card card-done">
              <div class="metric-icon">✅</div>
              <div class="metric-data">
                <h3 id="stat-month-done">0</h3>
                <p>പൂർത്തിയായവ</p>
                <div class="progress-bar-container">
                  <div id="prog-month-done" class="progress-segment" style="background:#16a34a; width:0%;"></div>
                </div>
              </div>
            </div>
            <div class="metric-card card-progress">
              <div class="metric-icon">🟡</div>
              <div class="metric-data">
                <h3 id="stat-month-progress">0</h3>
                <p>നടക്കുന്നവ</p>
                <div class="progress-bar-container">
                  <div id="prog-month-progress" class="progress-segment" style="background:#ca8a04; width:0%;"></div>
                </div>
              </div>
            </div>
            <div class="metric-card card-pending">
              <div class="metric-icon">🔴</div>
              <div class="metric-data">
                <h3 id="stat-month-pending">0</h3>
                <p>ബാക്കിയുള്ളവ</p>
                <div class="progress-bar-container">
                  <div id="prog-month-pending" class="progress-segment" style="background:#dc2626; width:0%;"></div>
                </div>
              </div>
            </div>
            <div class="metric-card card-missed">
              <div class="metric-icon">⚠️</div>
              <div class="metric-data">
                <h3 id="stat-month-missed">0</h3>
                <p>കാലാവധി കഴിഞ്ഞവ</p>
                <div class="progress-bar-container">
                  <div id="prog-month-missed" class="progress-segment" style="background:#7c3aed; width:0%;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Section B: Annual Cumulative Metrics -->
        <div>
          <div class="metrics-section-title">
            <span>🏆 വാർഷിക സമഗ്ര പുരോഗതി (Annual Year: <span id="metrics-active-year-label" style="color:#0284c7;">2026 - 2027</span>)</span>
          </div>
          <div class="metrics-grid">
            <div class="metric-card card-total">
              <div class="metric-icon">🏛️</div>
              <div class="metric-data">
                <h3 id="stat-annual-total">0</h3>
                <p>ആകെ വാർഷികം</p>
              </div>
            </div>
            <div class="metric-card card-done">
              <div class="metric-icon">✅</div>
              <div class="metric-data">
                <h3 id="stat-annual-done">0</h3>
                <p>ആകെ കഴിഞ്ഞവ</p>
                <div class="progress-bar-container">
                  <div id="prog-annual-done" class="progress-segment" style="background:#16a34a; width:0%;"></div>
                </div>
              </div>
            </div>
            <div class="metric-card card-progress">
              <div class="metric-icon">🟡</div>
              <div class="metric-data">
                <h3 id="stat-annual-progress">0</h3>
                <p>ആകെ നടക്കുന്നവ</p>
                <div class="progress-bar-container">
                  <div id="prog-annual-progress" class="progress-segment" style="background:#ca8a04; width:0%;"></div>
                </div>
              </div>
            </div>
            <div class="metric-card card-pending">
              <div class="metric-icon">🔴</div>
              <div class="metric-data">
                <h3 id="stat-annual-pending">0</h3>
                <p>ആകെ ബാക്കി</p>
                <div class="progress-bar-container">
                  <div id="prog-annual-pending" class="progress-segment" style="background:#dc2626; width:0%;"></div>
                </div>
              </div>
            </div>
            <div class="metric-card card-missed">
              <div class="metric-icon">⚠️</div>
              <div class="metric-data">
                <h3 id="stat-annual-missed">0</h3>
                <p>റീഷെഡ്യൂൾ ചെയ്തവ</p>
                <div class="progress-bar-container">
                  <div id="prog-annual-missed" class="progress-segment" style="background:#7c3aed; width:0%;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Perpetual Filter Panel with Year, Hijri Month, and Gregorian Month -->
      <div class="filter-panel">
        <div class="filter-controls-wrap">
          <!-- Year Selector -->
          <div style="display:flex; align-items:center; gap:5px;">
            <span style="font-size:12px; font-weight:800; color:#0f172a;">വർഷം:</span>
            <select id="cal-year-select" onchange="onYearOrCalendarChange()" class="year-dropdown">
              <option value="2026">2026 – 2027 (1448 – 1449)</option>
              <option value="2027">2027 – 2028 (1449 – 1450)</option>
              <option value="2028">2028 – 2029 (1450 – 1451)</option>
              <option value="2029">2029 – 2030 (1451 – 1452)</option>
              <option value="2030">2030 – 2031 (1452 – 1453)</option>
            </select>
          </div>

          <!-- Hijri Month Selector -->
          <div style="display:flex; align-items:center; gap:5px;">
            <span style="font-size:12px; font-weight:800; color:#065f46;">അറബി (ഹിജ്‌റ):</span>
            <select id="hijri-month-select" onchange="onHijriMonthChange()" class="month-dropdown">
              <option value="auto">🌟 ഇന്നത്തെ തീയതി (Auto)</option>
              <option value="all">മുഴുവൻ വർഷം (All 12 Months)</option>
              <option value="muharram">1. മുഹർറം</option>

      weekly: "വ്യാഴം/വെള്ളി ജുമുഅക്ക് ശേഷമുള്ള മൗലിദ്-സ്വലാത്ത്-കുത്തുബിയ്യത്ത് (ഇബാദ്); സഹചാരി പെട്ടി ശേഖരണം (സഹചാരി); വനിതാ ക്ലസ്റ്റർ പഠനം (IFC); ആശുപത്രി സന്ദർശനം.",
      monthly: "നിശ്ചിത വ്യാഴാഴ്ച രാവിൽ പ്രതിമാസ കുത്തുബിയ്യത്ത് & മൻഖൂസ് മൗലിദ്; ഒരു ഞായറാഴ്ച പള്ളി-ഖബർസ്ഥാൻ ശുചീകരണം (വിഖായ); പാലിയേറ്റീവ് ഹോം വിസിറ്റ്; യൂണിറ്റ് എക്സിക്യൂട്ടീവ് യോഗം."
    };

    function getHijriYearForPeriod(periodKey, baseYear) {
      // Base year 2026 corresponds to Hijri 1448 (starting Rabi al-Akhir 1448)
      const baseHijri = 1448 + (baseYear - 2026);
      const period = PERPETUAL_HIJRI_MONTHS[periodKey];
      const offset = period ? (period.hijriYearOffset || 0) : 0;
      return baseHijri + offset;
    }

    function getGregorianPeriodString(periodKey, baseYear) {
      const period = PERPETUAL_HIJRI_MONTHS[periodKey];
      if (!period) return "";
      const m1 = period.approxGregMonths[0];
      const m2 = period.approxGregMonths[1];
      const y1 = (m1 >= 8) ? baseYear : baseYear + 1;
      const y2 = (m2 >= 8) ? baseYear : baseYear + 1;
      return `${ML_MONTHS[m1]} - ${ML_MONTHS[m2]} ${y1 === y2 ? y1 : y1 + ' / ' + y2}`;
    }

    function getSystemDateInfo() {
      const now = new Date();
      const currentMonthIndex = now.getMonth(); // 0 to 11
      const currentDay = now.getDate();
      const currentYear = now.getFullYear();

      // Detect Hijri period based on month
      let detectedPeriodKey = "rabi_al_akhir";
      for (const [key, period] of Object.entries(PERPETUAL_HIJRI_MONTHS)) {
        if (period.approxGregMonths && period.approxGregMonths.includes(currentMonthIndex)) {
          detectedPeriodKey = key;
          break;
        }
      }

      const activeHijriYear = getHijriYearForPeriod(detectedPeriodKey, currentYear >= 2026 ? currentYear : 2026);
      const periodObj = PERPETUAL_HIJRI_MONTHS[detectedPeriodKey];

      // Identify today's special highlight
      const gregKey = `greg_${currentMonthIndex + 1}_${currentDay}`;
      let specialtyText = HISTORICAL_SPECIALTIES[gregKey] || "";

      if (!specialtyText) {
        const dayOfWeek = now.getDay();
        if (dayOfWeek === 4) { // Thursday
          specialtyText = "വ്യാഴാഴ്ച രാവ്: പ്രതിമാസ / പ്രതിവാര സ്വലാത്ത്, മൗലിദ്, കുത്തുബിയ്യത്ത് സദസ്സ്.";
        } else if (dayOfWeek === 5) { // Friday
          specialtyText = "വിശുദ്ധ ജുമുഅ ദിനം: പള്ളികളിലെ സഹചാരി പെട്ടി ശേഖരണവും പ്രാർത്ഥനാ സദസ്സും.";
        } else {
          specialtyText = `${periodObj.name} മാസം: ${periodObj.spiritualDays}`;
        }
      }

      return {
        now: now,
        year: currentYear,
        monthIndex: currentMonthIndex,
        day: currentDay,
        dayOfWeek: currentDay,
        formattedDate: `${currentYear} ${ML_MONTHS[currentMonthIndex]} ${currentDay} (${ML_DAYS[now.getDay()]})`,
        formattedDateFull: `${currentYear} ${ML_MONTHS[currentMonthIndex]} ${currentDay}, ${ML_DAYS[now.getDay()]}ാഴ്ച`,
        detectedPeriodKey: detectedPeriodKey,
        hijriTitle: `${periodObj.name} ${activeHijriYear}`,
        planTitle: `${periodObj.name} (${getGregorianPeriodString(detectedPeriodKey, currentYear)})`,
        theme: periodObj.theme,
        specialtyText: specialtyText
      };
    }

    function onYearOrCalendarChange() {
      const yrSel = document.getElementById('cal-year-select');
      if (yrSel) selectedActiveYear = parseInt(yrSel.value) || 2026;
      updateCalendarPeriodViews();
    }

    function onHijriMonthChange() {
      const hSel = document.getElementById('hijri-month-select');
      if (hSel) selectedActiveHijriMonth = hSel.value;
      updateCalendarPeriodViews();
    }

    function onGregorianMonthChange() {
      const gSel = document.getElementById('greg-month-select');
      const val = gSel ? gSel.value : "all";
      selectedActiveGregMonth = val;

      if (val !== "all") {
        const mIdx = parseInt(val);
        // Map to corresponding hijri month
        for (const [key, period] of Object.entries(PERPETUAL_HIJRI_MONTHS)) {
          if (period.approxGregMonths && period.approxGregMonths.includes(mIdx)) {
            selectedActiveHijriMonth = key;
            const hSel = document.getElementById('hijri-month-select');
            if (hSel) hSel.value = key;
            break;
          }
        }
      }
      updateCalendarPeriodViews();
    }

    function getSelectedPeriodDetails() {
      const sys = getSystemDateInfo();
      const yr = selectedActiveYear || 2026;
      const hVal = selectedActiveHijriMonth;

      if (hVal === "auto") {
        const hYr = getHijriYearForPeriod(sys.detectedPeriodKey, yr);
        const pObj = PERPETUAL_HIJRI_MONTHS[sys.detectedPeriodKey];
        return {
          key: sys.detectedPeriodKey,
          isAllYear: false,
          year: yr,
          hijriYear: hYr,
          periodObj: pObj,
          messagePeriodText: `ഇന്ന്: ${sys.formattedDateFull}\n> *ഹിജ്‌റ മാസം:* ${pObj.name} ${hYr}\n> *വർഷം:* ${yr} – ${yr + 1}\n> *പ്രധാന ലക്ഷ്യം:* ${pObj.theme}`,
          badgeText: `ഇന്ന്: ${sys.formattedDate} | ${pObj.name} ${hYr}`
        };
      } else if (hVal === "all") {
        return {
          key: "all",
          isAllYear: true,
          year: yr,
          hijriYear: `${1448 + (yr - 2026)} – ${1449 + (yr - 2026)}`,
          periodObj: null,
          messagePeriodText: `മുഴുവൻ വാർഷിക കർമ്മപദ്ധതികൾ (${yr} – ${yr + 1} / ഹിജ്‌റ ${1448 + (yr - 2026)} – ${1449 + (yr - 2026)})`,
          badgeText: `മുഴുവൻ മാസങ്ങൾ (${yr} – ${yr + 1})`
        };
      } else {
        const pObj = PERPETUAL_HIJRI_MONTHS[hVal] || PERPETUAL_HIJRI_MONTHS.rabi_al_akhir;
        const hYr = getHijriYearForPeriod(hVal, yr);
        return {
          key: hVal,
          isAllYear: false,
          year: yr,
          hijriYear: hYr,
          periodObj: pObj,
          messagePeriodText: `*ഹിജ്‌റ:* ${pObj.name} ${hYr} (${getGregorianPeriodString(hVal, yr)})\n> *പ്രധാന ലക്ഷ്യം:* ${pObj.theme}`,
          badgeText: `${pObj.name} ${hYr} (${getGregorianPeriodString(hVal, yr)})`
        };
      }
    }

    function updateCalendarPeriodViews() {
      const period = getSelectedPeriodDetails();
      const badge = document.getElementById('active-period-name');
      if (badge) badge.innerText = period.badgeText;

      const yrLabel = document.getElementById('metrics-active-year-label');
      if (yrLabel) yrLabel.innerText = `${period.year} – ${period.year + 1}`;

      const mLabel = document.getElementById('metrics-active-month-label');
      if (mLabel) {
        mLabel.innerText = period.isAllYear ? "മുഴുവൻ വാർഷികം" : (period.periodObj ? period.periodObj.name : "മാസം");
      }

      // Load tasks
      if (period.isAllYear) {
        let all = [];
        Object.values(PERPETUAL_HIJRI_MONTHS).forEach(p => { all = all.concat(p.tasks); });
        checklistTasks = all;
      } else if (period.periodObj && period.periodObj.tasks) {
        checklistTasks = [...period.periodObj.tasks];
      }
      saveTasks();
      refreshAllViews();
    }

    function calculateMetrics() {
      // 1. Calculate Active Month Stats
      const mTotal = checklistTasks.length || 1;
      const mDone = checklistTasks.filter(t => t.status === 'done').length;
      const mProg = checklistTasks.filter(t => t.status === 'in-progress').length;
      const mPend = checklistTasks.filter(t => t.status === 'pending').length;
      const mMiss = checklistTasks.filter(t => t.status === 'missed').length;

      const setEl = (id, text) => { const el = document.getElementById(id); if (el) el.innerText = text; };
      const setW = (id, pct) => { const el = document.getElementById(id); if (el) el.style.width = `${pct}%`; };

      setEl('stat-month-total', checklistTasks.length);
      setEl('stat-month-done', `${mDone} (${Math.round((mDone / mTotal) * 100)}%)`);
      setEl('stat-month-progress', `${mProg} (${Math.round((mProg / mTotal) * 100)}%)`);
      setEl('stat-month-pending', `${mPend} (${Math.round((mPend / mTotal) * 100)}%)`);
      setEl('stat-month-missed', `${mMiss} (${Math.round((mMiss / mTotal) * 100)}%)`);

      setW('prog-month-done', Math.round((mDone / mTotal) * 100));
      setW('prog-month-progress', Math.round((mProg / mTotal) * 100));
      setW('prog-month-pending', Math.round((mPend / mTotal) * 100));
      setW('prog-month-missed', Math.round((mMiss / mTotal) * 100));

      // 2. Calculate Annual Cumulative Stats (Sum of all 12 perpetual months)
      let allAnnualTasks = [];
      Object.values(PERPETUAL_HIJRI_MONTHS).forEach(p => {
        allAnnualTasks = allAnnualTasks.concat(p.tasks);
      });
      const aTotal = allAnnualTasks.length || 1;
      const aDone = allAnnualTasks.filter(t => t.status === 'done').length;
      const aProg = allAnnualTasks.filter(t => t.status === 'in-progress').length;
      const aPend = allAnnualTasks.filter(t => t.status === 'pending').length;
      const aMiss = allAnnualTasks.filter(t => t.status === 'missed').length;

      setEl('stat-annual-total', allAnnualTasks.length);
      setEl('stat-annual-done', `${aDone} (${Math.round((aDone / aTotal) * 100)}%)`);
      setEl('stat-annual-progress', `${aProg} (${Math.round((aProg / aTotal) * 100)}%)`);
      setEl('stat-annual-pending', `${aPend} (${Math.round((aPend / aTotal) * 100)}%)`);
      setEl('stat-annual-missed', `${aMiss} (${Math.round((aMiss / aTotal) * 100)}%)`);

      setW('prog-annual-done', Math.round((aDone / aTotal) * 100));
      setW('prog-annual-progress', Math.round((aProg / aTotal) * 100));
      setW('prog-annual-pending', Math.round((aPend / aTotal) * 100));
      setW('prog-annual-missed', Math.round((aMiss / aTotal) * 100));

      // 3. Render Breakdown Tables
      const wings = ["സഹചാരി", "വിഖായ", "ട്രെൻഡ്", "മീഡിയ", "ഇബാദ്", "ത്വലബ", "കോർ കമ്മിറ്റി"];
      const wingTbody = document.getElementById('subwing-stats-tbody');
      if (wingTbody) {
        wingTbody.innerHTML = '';
        wings.forEach(w => {
          const wTasks = checklistTasks.filter(t => t.wing.toLowerCase().includes(w.toLowerCase()));
          if (wTasks.length > 0) {
            const wDone = wTasks.filter(t => t.status === 'done').length;
            const wMissed = wTasks.filter(t => t.status === 'missed').length;
            const wRem = wTasks.length - wDone - wMissed;
            wingTbody.innerHTML += `
              <tr>
                <td><strong>${w}</strong></td>
                <td>${wTasks.length}</td>
                <td style="color:#16a34a; font-weight:700;">${wDone}</td>
                <td style="color:#dc2626; font-weight:700;">${wRem}</td>
                <td style="color:#7c3aed; font-weight:700;">${wMissed}</td>
              </tr>
            `;
          }
        });
      }

      const tierTbody = document.getElementById('tier-stats-tbody');
      if (tierTbody) {
        tierTbody.innerHTML = '';
        const tiers = [{ k: "core", n: "കോർ കമ്മിറ്റി" }, { k: "executive", n: "എക്സിക്യൂട്ടീവ്" }, { k: "members", n: "അംഗങ്ങൾ" }];
        tiers.forEach(tr => {
          const tTasks = checklistTasks.filter(t => t.tier === tr.k);
          const tDone = tTasks.filter(t => t.status === 'done').length;
          const pct = tTasks.length ? Math.round((tDone / tTasks.length) * 100) : 0;
          tierTbody.innerHTML += `
            <tr>
              <td><strong>${tr.n}</strong></td>
              <td>${tTasks.length}</td>
              <td style="color:#16a34a; font-weight:700;">${tDone}</td>
              <td style="color:#dc2626; font-weight:700;">${tTasks.length - tDone}</td>
              <td><span class="tag-pill">${pct}%</span></td>
            </tr>
          `;
        });
      }
    }

    function renderTodayView() {
      const sys = getSystemDateInfo();
      const subTitle = document.getElementById('today-view-subtitle');
      if (subTitle) subTitle.innerText = `ഇന്ന്: ${sys.formattedDateFull} | ${sys.hijriTitle}`;

      const bannerDate = document.getElementById('live-today-fulldate');
      if (bannerDate) bannerDate.innerText = `${sys.formattedDateFull} | ${sys.hijriTitle}`;

      const bannerSpec = document.getElementById('live-today-specialty');
      if (bannerSpec) bannerSpec.innerText = sys.specialtyText;

      const dailyEl = document.getElementById('today-daily-text');
      if (dailyEl) dailyEl.innerText = RECURRING_ROUTINES.daily;

      const weeklyEl = document.getElementById('today-weekly-text');
      if (weeklyEl) weeklyEl.innerText = RECURRING_ROUTINES.weekly;

      // Filter high priority / pending / in-progress tasks for today's focus
      const focusTasks = checklistTasks.filter(t => t.status === 'in-progress' || (t.status === 'pending' && t.priority === 'high'));
      renderTaskContainer('today-tasks-container', focusTasks.length > 0 ? focusTasks : checklistTasks.slice(0, 5));

      // Build WhatsApp shareable message for Today
      let msg = `*SKSSF ആറങ്ങാടി യൂണിറ്റ്*\n📅 *ഇന്നത്തെ കർമ്മപദ്ധതി & ആക്ഷൻ പ്ലാൻ*\n> 🗓 *തീയതി:* ${sys.formattedDateFull}\n> 🌙 *ഹിജ്‌റ:* ${sys.hijriTitle}\n━━━━━━━━━━━━━━━━━━━━━\n\n${ARABIC_SALAM_FULL}\n\n🌟 *ഇന്നത്തെ ദിനവിശേഷം:* \n> ${sys.specialtyText}\n\n☀️ *ഇന്ന് നിർവ്വഹിക്കേണ്ട നിത്യേനയുള്ള ശീലം:*\n> • ${RECURRING_ROUTINES.daily}\n\n🕌 *പ്രതിവാര ശീലം:*\n> • ${RECURRING_ROUTINES.weekly}\n\n📌 *ഇന്ന് മുൻഗണന നൽകേണ്ട പ്രധാന ടാസ്‌കുകൾ:*\n`;

      if (focusTasks.length > 0) {
        focusTasks.forEach((t, i) => {
          msg += `${i + 1}. *${t.title}* [${t.status === 'in-progress' ? '🟡 നടക്കുന്നു' : '🔴 ബാക്കി'}]\n   > _ചുമതല: ${t.resp} | വിംഗ്: ${t.wing}_\n`;
        });
      } else {
        msg += `_ഈ മാസത്തെ പ്രധാന ടാസ്‌കുകൾ ചിട്ടയായി പുരോഗമിക്കുന്നു._\n`;
      }

      msg += `\n_ഓരോരുത്തരും സ്വന്തം ഉത്തരവാദിത്തങ്ങൾ ഭംഗിയായി പൂർത്തിയാക്കുമല്ലോ._\n\n` + getAttributionFooter();

      const box = document.getElementById('today-whatsapp-msg');
      if (box) box.innerText = msg;

      const waBtn = document.getElementById('share-today-wa');
      if (waBtn) waBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
    }

    function refreshAllViews() {
      calculateMetrics();
      renderAdminDashboard();
      renderTodayView();
      renderTaskContainer('all-tasks-container', checklistTasks);

      const coreTasks = checklistTasks.filter(t => t.tier === 'core');
      renderTaskContainer('core-tasks-container', coreTasks);
      const coreText = buildCoreMsg();
      document.getElementById('core-msg').innerText = coreText;
      document.getElementById('share-core-wa').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(coreText)}`;

      const execTasks = checklistTasks.filter(t => t.tier === 'executive');
      renderTaskContainer('exec-tasks-container', execTasks);
      const execText = buildExecutiveMsg();
      document.getElementById('exec-msg').innerText = execText;
      document.getElementById('share-exec-wa').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(execText)}`;

      const memberTasks = checklistTasks.filter(t => t.tier === 'members');
      renderTaskContainer('members-tasks-container', memberTasks);
      const allText = buildAllMembersMsg();
      document.getElementById('allmembers-msg').innerText = allText;
      document.getElementById('share-allmembers-wa').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(allText)}`;

      const pubText = buildPublicMsg();
      document.getElementById('public-msg').innerText = pubText;
      document.getElementById('share-public-wa').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(pubText)}`;

      renderIndividualView();
      renderWingView();
      renderAgendaView();
    }

    function switchTab(name) {
      if (currentUserRole === 'public' && name !== 'analytics' && name !== 'public' && name !== 'today') {
        name = 'today';
      } else if (currentUserRole === 'executive' && (name === 'core' || name === 'admin')) {
        name = 'executive';
      } else if (currentUserRole === 'members' && (name === 'core' || name === 'executive' || name === 'admin')) {
        name = 'allmembers';
      }

      document.querySelectorAll('.content-card').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      const targetView = document.getElementById(`view-${name}`);
      const targetBtn = document.getElementById(`tab-${name}`);

      if (targetView) targetView.classList.remove('hidden');
      if (targetBtn) targetBtn.classList.add('active');
    }

    function initApp() {
      const sys = getSystemDateInfo();
      selectedActiveYear = sys.year >= 2026 ? sys.year : 2026;

      const yrSel = document.getElementById('cal-year-select');
      if (yrSel) yrSel.value = selectedActiveYear.toString();

      const dInput = document.getElementById('agenda-custom-date');
      if (dInput && !dInput.value) dInput.value = `${sys.formattedDateFull}`;

      populatePersonSelect();

      const wSel = document.getElementById('wing-select');
      if (wSel && wSel.children.length === 0) {
        Object.keys(subWingsRegistry).forEach(wName => {
          const opt = document.createElement('option');
          opt.value = wName;
          opt.innerText = `${wName} (${subWingsRegistry[wName].lead})`;
          wSel.appendChild(opt);
        });
      }

      updateCalendarPeriodViews();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (safeGetAuth()) unlockInterface();
      else lockInterface();
    });
  </script>
</body>
</html>
